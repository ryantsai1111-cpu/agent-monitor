name: AgentMonitor
options:
  bundleIdPrefix: com.ryantsai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  AgentMonitor:
    type: application
    platform: iOS
    sources:
      - AgentMonitor
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryantsai.agentmonitor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: AgentMonitor/Info.plist
      properties:
        CFBundleDisplayName: Agent Monitor
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: AgentMonitor/AgentMonitor.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ryantsai.agentmonitor
    dependencies:
      - target: AgentMonitorWidget

  AgentMonitorWidget:
    type: app-extension
    platform: iOS
    sources:
      - AgentMonitorWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryantsai.agentmonitor.widget
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: AgentMonitorWidget/Info.plist
      properties:
        CFBundleDisplayName: Agent Monitor Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AgentMonitorWidget/AgentMonitorWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ryantsai.agentmonitor
